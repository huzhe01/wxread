name: Tencent Jobs Scraper

on:
  schedule:
    # Daily at 01:00 UTC (09:00 Beijing)
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper
      env:
        PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
        PUSH_KEY: ${{ secrets.PUSH_KEY }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SERVERCHAN_SPT: ${{ secrets.SERVERCHAN_SPT }}
      run: |
        python -m src.tasks.information_notice.tencent_jobs
        
    - name: Upload CSV Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tencent-jobs-csv
        path: information_notice/*.csv
        retention-days: 7
