name: Aixinwu Daily Check-in

on:
  schedule:
    # Run at 00:30 UTC every day (8:30 AM Beijing Time)
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium

    - name: Restore Login State
      env:
        AIXINWU_STATE: ${{ secrets.AIXINWU_STATE }}
      run: |
        if [ -n "$AIXINWU_STATE" ]; then
          echo "$AIXINWU_STATE" > aixinwu_state.json
          echo "✅ Login state restored from secret"
        else
          echo "⚠️ AIXINWU_STATE secret is empty or not set"
        fi

    - name: Run Check-in
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
        PUSH_KEY: ${{ secrets.PUSH_KEY }}
      run: |
        python -m src.tasks.aixinwu checkin
